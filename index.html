<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paynote • Skull Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .danger-card { background: #111113; border: 1px solid #3f1f1f; }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .nav-tab.active { background: #ef4444; color: white; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .skull-pattern { background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22><text x=%2250%25%22 y=%2250%25%22 font-size=%22280%22 fill=%22%23ef4444%22 opacity=%220.035%22 text-anchor=%22middle%22>☠</text></svg>'); background-size: 110px 110px; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white skull-pattern">
    
    <!-- Login -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center px-6">
        <div class="w-full max-w-sm">
            <div class="text-center mb-10">
                <div class="mx-auto w-20 h-20 bg-[#ef4444] rounded-[22px] flex items-center justify-center mb-6">
                    <i class="fa-solid fa-skull text-white text-5xl"></i>
                </div>
                <h1 class="text-6xl font-black tracking-tighter">SKULL</h1>
                <p class="text-[#ef4444] text-2xl font-bold -mt-2">COMMAND</p>
            </div>

            <div class="danger-card rounded-3xl p-8">
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">ADMIN EMAIL</label>
                        <input type="email" id="email" class="w-full bg-[#1a1a1a] border border-[#3f1f1f] rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-[#ef4444]" placeholder="admin@paynote.com" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">PASSWORD</label>
                        <input type="password" id="password" class="w-full bg-[#1a1a1a] border border-[#3f1f1f] rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-[#ef4444]" placeholder="••••••••" required>
                    </div>
                    <div id="error" class="text-[#ef4444] text-sm hidden"></div>
                    <button type="submit" class="w-full bg-[#ef4444] py-4 rounded-2xl font-bold text-lg">ENTER THE VOID</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboardScreen" class="hidden">
        <div class="max-w-5xl mx-auto px-5 pb-20">
            
            <!-- Header -->
            <div class="flex justify-between items-center pt-6 pb-8">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-[#ef4444] rounded-2xl flex items-center justify-center">
                        <i class="fa-solid fa-skull text-white text-3xl"></i>
                    </div>
                    <div>
                        <h1 class="text-4xl font-black tracking-tighter">SKULL COMMAND</h1>
                        <p class="text-[#ef4444] text-xs font-bold tracking-[3px]">ABSOLUTE CONTROL</p>
                    </div>
                </div>
                <button onclick="logout()" class="px-5 py-2.5 bg-[#1a1a1a] hover:bg-[#ef4444] hover:text-white text-[#ef4444] rounded-2xl text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-power-off"></i> EXIT
                </button>
            </div>

            <!-- Revenue Chart -->
            <div class="danger-card rounded-3xl p-6 mb-8">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h3 class="font-bold text-xl">Revenue Overview</h3>
                        <p class="text-sm text-zinc-400">Last 30 days</p>
                    </div>
                </div>
                <canvas id="revenueChart" height="120"></canvas>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="danger-card rounded-3xl p-6">
                    <div class="flex justify-between">
                        <div>
                            <p class="text-sm text-zinc-400">TOTAL USERS</p>
                            <div id="totalUsers" class="text-6xl font-black">—</div>
                        </div>
                        <i class="fa-solid fa-users text-[#ef4444] text-4xl"></i>
                    </div>
                </div>
                <div class="danger-card rounded-3xl p-6">
                    <div class="flex justify-between">
                        <div>
                            <p class="text-sm text-zinc-400">TOTAL INVOICES</p>
                            <div id="totalInvoices" class="text-6xl font-black">—</div>
                        </div>
                        <i class="fa-solid fa-file-invoice text-[#ef4444] text-4xl"></i>
                    </div>
                </div>
            </div>

            <!-- Search -->
            <div class="mb-6">
                <input type="text" id="searchInput" placeholder="Search users..." 
                       class="w-full bg-[#1a1a1a] border border-[#3f1f1f] rounded-2xl px-5 py-3 text-lg focus:outline-none focus:border-[#ef4444]">
            </div>

            <!-- Tabs -->
            <div class="flex bg-[#1a1a1a] rounded-2xl p-1 mb-6">
                <button onclick="switchTab(0)" class="nav-tab flex-1 py-3 text-sm font-bold active" data-tab="0">USERS</button>
                <button onclick="switchTab(1)" class="nav-tab flex-1 py-3 text-sm font-bold text-zinc-400" data-tab="1">INVOICES</button>
                <button onclick="switchTab(2)" class="nav-tab flex-1 py-3 text-sm font-bold text-zinc-400" data-tab="2">LOGS</button>
            </div>

            <div id="tabContent"></div>
        </div>
    </div>

    <!-- User Detail View -->
    <div id="userDetailView" class="hidden max-w-5xl mx-auto px-5 pb-20">
        <div class="pt-6 pb-4 flex items-center gap-4">
            <button onclick="backToDashboard()" class="flex items-center gap-2 text-[#ef4444]">
                <i class="fa-solid fa-arrow-left"></i> <span class="font-semibold">Back</span>
            </button>
            <h2 class="text-2xl font-bold">User Details</h2>
        </div>
        
        <div id="userDetailContent"></div>
    </div>

    <script>
        let token = localStorage.getItem('adminToken') || '';
        let allUsers = [];
        let revenueChartInstance = null;

        // Auto login
        if (token) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            loadDashboard();
        }

        // Login Form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            try {
                const res = await fetch('https://paynote2.onrender.com/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.token) {
                    token = data.token;
                    localStorage.setItem('adminToken', token);
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('dashboardScreen').classList.remove('hidden');
                    loadDashboard();
                } else {
                    errorDiv.textContent = data.error || 'ACCESS DENIED';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'CONNECTION FAILED';
                errorDiv.classList.remove('hidden');
            }
        });

        async function loadDashboard() {
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                document.getElementById('totalUsers').textContent = data.stats?.totalUsers || 0;
                document.getElementById('totalInvoices').textContent = data.stats?.totalInvoices || 0;

                // Load users
                const usersRes = await fetch('https://paynote2.onrender.com/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                allUsers = await usersRes.json();

                // Render Revenue Chart
                renderRevenueChart(data);

                switchTab(0);
                
                // Search
                document.getElementById('searchInput').addEventListener('input', filterUsers);
            } catch (err) {}
        }

        function renderRevenueChart(data) {
            const ctx = document.getElementById('revenueChart');
            
            if (revenueChartInstance) revenueChartInstance.destroy();

            const labels = ['Week 1', 'Week 2', 'Week 3', 'Week 4'];
            const values = [
                data.stats?.totalRevenue * 0.3 || 120000,
                data.stats?.totalRevenue * 0.25 || 95000,
                data.stats?.totalRevenue * 0.28 || 110000,
                data.stats?.totalRevenue * 0.17 || 75000
            ];

            revenueChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Revenue (₦)',
                        data: values,
                        backgroundColor: '#ef4444',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#3f1f1f' } },
                        x: { grid: { color: '#3f1f1f' } }
                    }
                }
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(btn => {
                btn.classList.remove('bg-[#ef4444]', 'text-white');
                btn.classList.add('text-zinc-400');
            });
            
            const activeBtn = document.querySelector(`.nav-tab[data-tab="${tab}"]`);
            if (activeBtn) activeBtn.classList.add('bg-[#ef4444]', 'text-white');

            const content = document.getElementById('tabContent');
            content.innerHTML = `<div class="flex justify-center py-12"><i class="fa-solid fa-skull fa-spin text-[#ef4444] text-4xl"></i></div>`;

            if (tab === 0) loadUsers();
            else if (tab === 1) loadInvoices();
            else if (tab === 2) loadLogs();
        }

        function filterUsers() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                u.name.toLowerCase().includes(term) || u.email.toLowerCase().includes(term)
            );
            
            const content = document.getElementById('tabContent');
            let html = `<div class="space-y-3">`;
            filtered.forEach(user => {
                html += `
                    <div onclick="showUserDetail('${user.id}')" class="danger-card p-5 rounded-3xl cursor-pointer flex justify-between items-center">
                        <div>
                            <div class="font-semibold">${user.name}</div>
                            <div class="text-sm text-zinc-400">${user.email}</div>
                        </div>
                        <span class="px-3 py-1 text-xs rounded-full ${user.billing_status === 'paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-[#ef4444]/20 text-[#ef4444]'}">${user.billing_status}</span>
                    </div>
                `;
            });
            html += `</div>`;
            content.innerHTML = html;
        }

        async function loadUsers() {
            const content = document.getElementById('tabContent');
            let html = `<div class="space-y-3">`;
            allUsers.forEach(user => {
                html += `
                    <div onclick="showUserDetail('${user.id}')" class="danger-card p-5 rounded-3xl cursor-pointer flex justify-between items-center">
                        <div>
                            <div class="font-semibold">${user.name}</div>
                            <div class="text-sm text-zinc-400">${user.email}</div>
                        </div>
                        <span class="px-3 py-1 text-xs rounded-full ${user.billing_status === 'paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-[#ef4444]/20 text-[#ef4444]'}">${user.billing_status}</span>
                    </div>
                `;
            });
            html += `</div>`;
            content.innerHTML = html;
        }

        async function loadInvoices() {
            const content = document.getElementById('tabContent');
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/invoices', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const invoices = await res.json();

                let html = `<div class="space-y-3">`;
                invoices.forEach(inv => {
                    html += `
                        <div class="danger-card p-5 rounded-3xl">
                            <div class="flex justify-between">
                                <div>${inv.customer_name}</div>
                                <div class="font-bold">₦${inv.total_amount}</div>
                            </div>
                            <div class="mt-4 flex justify-between items-center">
                                <span class="px-3 py-1 text-xs rounded-full ${inv.status === 'paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-[#ef4444]/20 text-[#ef4444]'}">${inv.status}</span>
                                <div class="flex gap-2">
                                    <button onclick="markInvoicePaid('${inv.id}')" class="px-4 py-2 text-sm bg-emerald-500/10 text-emerald-400 rounded-2xl">MARK PAID</button>
                                    <button onclick="deleteInvoice('${inv.id}')" class="px-4 py-2 text-sm bg-[#ef4444]/10 text-[#ef4444] rounded-2xl">DELETE</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="text-center py-12 text-[#ef4444]">Failed to load invoices</div>`;
            }
        }

        async function loadLogs() {
            const content = document.getElementById('tabContent');
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/logs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const logs = await res.json();

                let html = `<div class="space-y-2">`;
                logs.slice(0, 35).forEach(log => {
                    html += `<div class="danger-card px-5 py-3 rounded-2xl text-sm">${log.action}</div>`;
                });
                html += `</div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="text-center py-12 text-[#ef4444]">Failed to load logs</div>`;
            }
        }

        // ==================== USER DETAIL PAGE ====================
        async function showUserDetail(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('userDetailView').classList.remove('hidden');

            const content = document.getElementById('userDetailContent');
            
            // Get user's invoices
            let userInvoices = [];
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/invoices', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const allInvoices = await res.json();
                userInvoices = allInvoices.filter(inv => inv.user_id === userId || inv.customer_email === user.email);
            } catch (e) {}

            content.innerHTML = `
                <div class="danger-card rounded-3xl p-8 mb-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="text-3xl font-bold">${user.name}</div>
                            <div class="text-xl text-zinc-400">${user.email}</div>
                        </div>
                        <div>
                            <span class="px-4 py-1 rounded-full text-sm ${user.billing_status === 'paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-[#ef4444]/20 text-[#ef4444]'}">${user.billing_status}</span>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="danger-card rounded-3xl p-6 mb-6">
                    <h4 class="font-bold mb-4">CONTROLS</h4>
                    <div class="flex flex-wrap gap-3">
                        <button onclick="changeUserTier('${userId}', 'free')" class="px-5 py-2 bg-[#1a1a1a] rounded-2xl text-sm">Free</button>
                        <button onclick="changeUserTier('${userId}', 'premium')" class="px-5 py-2 bg-[#1a1a1a] rounded-2xl text-sm">Premium</button>
                        <button onclick="changeUserTier('${userId}', 'enterprise')" class="px-5 py-2 bg-[#1a1a1a] rounded-2xl text-sm">Enterprise</button>
                        <button onclick="changeUserTier('${userId}', 'suspended')" class="px-5 py-2 bg-[#1a1a1a] rounded-2xl text-sm">Suspended</button>
                        <button onclick="deleteUser('${userId}', '${user.name}')" class="px-5 py-2 bg-[#ef4444] text-white rounded-2xl text-sm">DELETE USER</button>
                    </div>
                </div>

                <!-- User Invoices -->
                <div class="danger-card rounded-3xl p-6 mb-6">
                    <h4 class="font-bold mb-4">INVOICES (${userInvoices.length})</h4>
                    ${userInvoices.length > 0 ? userInvoices.map(inv => `
                        <div class="flex justify-between items-center py-3 border-t border-[#3f1f1f]">
                            <div>₦${inv.total_amount} - ${inv.status}</div>
                            <div class="flex gap-2">
                                <button onclick="markInvoicePaid('${inv.id}')" class="text-emerald-400 text-sm">Mark Paid</button>
                                <button onclick="deleteInvoice('${inv.id}')" class="text-[#ef4444] text-sm">Delete</button>
                            </div>
                        </div>
                    `).join('') : '<p class="text-zinc-400">No invoices found</p>'}
                </div>

                <!-- Activity -->
                <div class="danger-card rounded-3xl p-6">
                    <h4 class="font-bold mb-4">ACTIVITY HISTORY</h4>
                    <div id="userActivity" class="text-sm text-zinc-400">Loading activities...</div>
                </div>
            `;

            // Load user activity
            loadUserActivity(user.email);
        }

        async function loadUserActivity(userEmail) {
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/logs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const logs = await res.json();
                
                const userLogs = logs.filter(log => log.email === userEmail);
                const container = document.getElementById('userActivity');
                
                if (userLogs.length === 0) {
                    container.innerHTML = '<p class="text-zinc-400">No activity found</p>';
                    return;
                }
                
                let html = '';
                userLogs.slice(0, 15).forEach(log => {
                    html += `<div class="py-2 border-b border-[#3f1f1f]">${log.action} — <span class="text-xs text-zinc-500">${new Date(log.timestamp).toLocaleString()}</span></div>`;
                });
                container.innerHTML = html;
            } catch (err) {
                document.getElementById('userActivity').innerHTML = '<p class="text-red-400">Failed to load activity</p>';
            }
        }

        function backToDashboard() {
            document.getElementById('userDetailView').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
        }

        async function changeUserTier(userId, tier) {
            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/user/${userId}/status`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: tier })
                });

                if (res.ok) {
                    alert(`Tier changed to ${tier}`);
                    // Refresh current view
                    showUserDetail(userId);
                } else {
                    alert('Failed to update tier');
                }
            } catch (err) {
                alert('Error');
            }
        }

        async function deleteUser(id, name) {
            if (!confirm(`Delete "${name}" permanently?`)) return;
            
            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/user/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    alert('User deleted');
                    backToDashboard();
                    loadUsers();
                } else {
                    alert('Failed to delete');
                }
            } catch (err) {
                alert('Error');
            }
        }

        async function deleteInvoice(id) {
            if (!confirm('Delete this invoice?')) return;
            
            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/invoice/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    alert('Invoice deleted');
                    backToDashboard();
                    loadInvoices();
                } else {
                    alert('Failed to delete');
                }
            } catch (err) {
                alert('Error');
            }
        }

        async function markInvoicePaid(id) {
            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/invoice/${id}/mark-paid`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    alert('Marked as paid');
                    backToDashboard();
                    loadInvoices();
                } else {
                    alert('Failed');
                }
            } catch (err) {
                alert('Error');
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }
    </script>
</body>
</html>

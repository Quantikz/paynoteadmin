<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paynote • Skull Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        .danger-red {
            color: #ef4444;
        }
        
        .skull-bg {
            background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
        }
        
        .danger-card {
            background: #111113;
            border: 1px solid #3f1f1f;
            transition: all 0.3s ease;
        }
        
        .danger-card:hover {
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.1);
        }
        
        .skull-icon {
            filter: drop-shadow(0 0 8px #ef4444);
        }
        
        .section-header {
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        
        .data-text {
            font-size: clamp(0.875rem, 3.5vw, 1rem);
            line-height: 1.3;
            word-break: break-word;
        }
        
        .danger-btn {
            transition: all 0.2s ease;
        }
        
        .danger-btn:hover {
            background: #ef4444;
            color: white;
            transform: translateY(-1px);
        }
        
        .nav-tab {
            transition: all 0.2s ease;
        }
        
        .nav-tab.active {
            background: #ef4444;
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }
        
        .stat-value {
            font-size: clamp(2rem, 7vw, 3rem);
            font-weight: 800;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white">
    
    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center px-6 bg-[#0a0a0a]">
        <div class="w-full max-w-sm">
            <div class="text-center mb-10">
                <div class="mx-auto w-20 h-20 bg-[#ef4444] rounded-[22px] flex items-center justify-center mb-6 skull-icon">
                    <i class="fa-solid fa-skull text-white text-5xl"></i>
                </div>
                <h1 class="text-5xl font-black tracking-tighter">SKULL</h1>
                <p class="text-[#ef4444] text-xl font-bold tracking-[3px] mt-1">CONTROL</p>
                <p class="text-zinc-500 mt-3 text-sm">ABSOLUTE POWER • NO MERCY</p>
            </div>

            <div class="danger-card rounded-3xl p-8">
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">ADMIN EMAIL</label>
                        <input type="email" id="email" class="w-full bg-[#1a1a1a] border border-[#3f1f1f] rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-[#ef4444]" placeholder="admin@paynote.com" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-400 mb-2">PASSWORD</label>
                        <input type="password" id="password" class="w-full bg-[#1a1a1a] border border-[#3f1f1f] rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-[#ef4444]" placeholder="••••••••" required>
                    </div>
                    
                    <div id="error" class="text-[#ef4444] text-sm hidden"></div>
                    
                    <button type="submit" class="w-full bg-[#ef4444] hover:bg-[#dc2626] py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-3 transition-all active:scale-[0.985]">
                        <span>ENTER THE VOID</span>
                        <i class="fa-solid fa-skull"></i>
                    </button>
                </form>
            </div>
            
            <p class="text-center text-[10px] text-zinc-500 mt-8 tracking-[1px]">AUTHORIZED PERSONNEL ONLY • 2026</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardScreen" class="hidden">
        <div class="max-w-5xl mx-auto px-5 pb-20">
            
            <!-- Header -->
            <div class="flex items-center justify-between pt-6 pb-8">
                <div class="flex items-center gap-4">
                    <div class="w-11 h-11 bg-[#ef4444] rounded-2xl flex items-center justify-center">
                        <i class="fa-solid fa-skull text-white text-3xl"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black tracking-tighter">SKULL CONTROL</h1>
                        <p class="text-[#ef4444] text-xs font-bold tracking-[2px]">ABSOLUTE AUTHORITY</p>
                    </div>
                </div>
                
                <button onclick="logout()" class="flex items-center gap-2 px-5 py-2.5 bg-[#1a1a1a] hover:bg-[#ef4444] hover:text-white text-[#ef4444] rounded-2xl text-sm font-semibold transition-all">
                    <i class="fa-solid fa-power-off"></i>
                    <span>EXIT</span>
                </button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="danger-card rounded-3xl p-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-zinc-400 text-sm">TOTAL USERS</p>
                            <div id="totalUsers" class="stat-value text-white mt-1">—</div>
                        </div>
                        <i class="fa-solid fa-users text-[#ef4444] text-3xl"></i>
                    </div>
                </div>
                
                <div class="danger-card rounded-3xl p-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-zinc-400 text-sm">TOTAL INVOICES</p>
                            <div id="totalInvoices" class="stat-value text-white mt-1">—</div>
                        </div>
                        <i class="fa-solid fa-file-invoice text-[#ef4444] text-3xl"></i>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex bg-[#1a1a1a] rounded-2xl p-1 mb-6">
                <button onclick="switchTab(0)" class="nav-tab flex-1 py-3 text-sm font-bold rounded-[14px] active-tab" data-tab="0">USERS</button>
                <button onclick="switchTab(1)" class="nav-tab flex-1 py-3 text-sm font-bold text-zinc-400 rounded-[14px]" data-tab="1">INVOICES</button>
                <button onclick="switchTab(2)" class="nav-tab flex-1 py-3 text-sm font-bold text-zinc-400 rounded-[14px]" data-tab="2">LOGS</button>
            </div>

            <!-- Content -->
            <div id="tabContent" class="min-h-[400px]"></div>
            
        </div>
    </div>

    <script>
        let token = localStorage.getItem('adminToken') || '';

        // Auto login
        if (token) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            loadDashboard();
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            try {
                const res = await fetch('https://paynote2.onrender.com/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.token) {
                    token = data.token;
                    localStorage.setItem('adminToken', token);
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('dashboardScreen').classList.remove('hidden');
                    loadDashboard();
                } else {
                    errorDiv.textContent = data.error || 'ACCESS DENIED';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'CONNECTION FAILED';
                errorDiv.classList.remove('hidden');
            }
        });

        async function loadDashboard() {
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                document.getElementById('totalUsers').textContent = data.stats?.totalUsers || 0;
                document.getElementById('totalInvoices').textContent = data.stats?.totalInvoices || 0;

                switchTab(0);
            } catch (err) {}
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-tab').forEach((btn, i) => {
                if (i === tab) {
                    btn.classList.add('bg-[#ef4444]', 'text-white');
                    btn.classList.remove('text-zinc-400');
                } else {
                    btn.classList.remove('bg-[#ef4444]', 'text-white');
                    btn.classList.add('text-zinc-400');
                }
            });

            const content = document.getElementById('tabContent');
            content.innerHTML = `<div class="flex justify-center py-12"><i class="fa-solid fa-skull fa-spin text-[#ef4444] text-4xl"></i></div>`;

            if (tab === 0) loadUsers();
            else if (tab === 1) loadInvoices();
            else if (tab === 2) loadLogs();
        }

        async function loadUsers() {
            const content = document.getElementById('tabContent');
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const users = await res.json();

                let html = `<div class="space-y-3">`;
                users.forEach(user => {
                    html += `
                        <div class="danger-card p-5 rounded-3xl flex justify-between items-center">
                            <div class="flex-1 min-w-0 pr-4">
                                <div class="data-text font-semibold truncate">${user.name}</div>
                                <div class="data-text text-zinc-400 truncate">${user.email}</div>
                            </div>
                            <button onclick="deleteUser('${user.id}', '${user.name}')" 
                                    class="danger-btn px-5 py-2 bg-[#3f1f1f] text-[#ef4444] text-sm font-bold rounded-2xl whitespace-nowrap">
                                DELETE
                            </button>
                        </div>
                    `;
                });
                html += `</div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="text-center py-12 text-[#ef4444]">FAILED TO LOAD USERS</div>`;
            }
        }

        async function loadInvoices() {
            const content = document.getElementById('tabContent');
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/invoices', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const invoices = await res.json();

                let html = `<div class="space-y-3">`;
                invoices.forEach(inv => {
                    html += `
                        <div class="danger-card p-5 rounded-3xl">
                            <div class="flex justify-between items-start gap-4">
                                <div class="flex-1 min-w-0">
                                    <div class="data-text font-semibold truncate">${inv.customer_name}</div>
                                    <div class="data-text text-zinc-400 text-sm truncate">${inv.customer_email}</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-bold">₦${inv.total_amount}</div>
                                </div>
                            </div>
                            
                            <div class="mt-4 flex justify-between items-center">
                                <span class="px-3 py-1 text-xs rounded-full ${inv.status === 'paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-[#ef4444]/20 text-[#ef4444]'}">
                                    ${inv.status.toUpperCase()}
                                </span>
                                <button onclick="markInvoicePaid('${inv.id}')" class="px-4 py-2 text-sm bg-emerald-500/10 text-emerald-400 rounded-2xl font-medium">MARK PAID</button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="text-center py-12 text-[#ef4444]">FAILED TO LOAD INVOICES</div>`;
            }
        }

        async function loadLogs() {
            const content = document.getElementById('tabContent');
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/logs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const logs = await res.json();

                let html = `<div class="space-y-2">`;
                logs.slice(0, 25).forEach(log => {
                    html += `
                        <div class="danger-card px-5 py-3 rounded-2xl text-sm flex justify-between">
                            <div class="font-medium">${log.action}</div>
                            <div class="text-zinc-400 text-xs">${new Date(log.timestamp).toLocaleTimeString()}</div>
                        </div>
                    `;
                });
                html += `</div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="text-center py-12 text-[#ef4444]">FAILED TO LOAD LOGS</div>`;
            }
        }

        async function deleteUser(id, name) {
            if (!confirm(`PERMANENTLY DELETE "${name}"?`)) return;

            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/user/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    alert('USER TERMINATED');
                    switchTab(0);
                } else {
                    alert('FAILED TO TERMINATE');
                }
            } catch (err) {
                alert('ERROR TERMINATING USER');
            }
        }

        async function markInvoicePaid(id) {
            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/invoice/${id}/mark-paid`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    alert('INVOICE MARKED PAID');
                    switchTab(1);
                } else {
                    alert('FAILED TO UPDATE');
                }
            } catch (err) {
                alert('ERROR');
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }
    </script>
</body>
</html>

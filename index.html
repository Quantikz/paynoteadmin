<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paynote • Absolute Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .glass { background: rgba(18,18,26,0.95); backdrop-filter: blur(24px); }
        .nav-active { background: #10b981; color: white !important; }
        .stat-card { transition: all 0.3s ease; }
        .control-btn { transition: all 0.2s ease; }
        .danger-btn:hover { background: #ef4444; color: white; }
    </style>
</head>
<body class="bg-[#0a0a0f] text-white">
    <!-- Top Bar -->
    <div class="sticky top-0 z-50 bg-[#0a0a0f]/95 border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-500 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-skull text-white text-2xl"></i>
                </div>
                <div>
                    <span class="font-bold text-3xl tracking-tighter">paynote</span>
                    <span class="text-red-400 font-bold ml-1">ABSOLUTE</span>
                </div>
            </div>
            <div id="adminHeader" class="hidden flex items-center gap-4">
                <div class="px-4 py-1.5 bg-red-500/10 text-red-400 rounded-2xl text-sm flex items-center gap-2">
                    <i class="fa-solid fa-user-shield"></i>
                    <span id="adminEmailHeader"></span>
                </div>
                <button onclick="logout()" class="px-5 py-2 bg-white/10 hover:bg-red-500/30 rounded-2xl text-sm flex items-center gap-2">
                    <i class="fa-solid fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </div>

    <!-- Login -->
    <div id="loginScreen" class="max-w-md mx-auto px-6 pt-20">
        <div class="text-center mb-10">
            <div class="mx-auto w-24 h-24 bg-red-500 rounded-3xl flex items-center justify-center mb-6">
                <i class="fa-solid fa-skull text-white text-5xl"></i>
            </div>
            <h1 class="text-5xl font-bold tracking-tighter">Absolute Control</h1>
            <p class="text-zinc-400 mt-2">You now own the entire system</p>
        </div>

        <div class="glass border border-white/10 rounded-3xl p-8">
            <form id="adminLoginForm">
                <div class="space-y-5">
                    <input type="email" id="adminEmailInput" class="w-full bg-zinc-900 border border-white/20 rounded-2xl px-5 py-4 text-lg" placeholder="Admin Email" required>
                    <input type="password" id="adminPasswordInput" class="w-full bg-zinc-900 border border-white/20 rounded-2xl px-5 py-4 text-lg" placeholder="Password" required>
                </div>
                <div id="loginError" class="text-red-400 text-sm mt-4 hidden"></div>
                <button type="submit" class="mt-6 w-full bg-red-500 hover:bg-red-600 py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-3">
                    TAKE FULL CONTROL
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardScreen" class="hidden max-w-7xl mx-auto px-6 pb-12">
        <!-- Quick Actions -->
        <div class="flex flex-wrap gap-3 mt-6">
            <button onclick="refreshAll()" class="px-6 py-3 bg-white/10 hover:bg-white/20 rounded-2xl flex items-center gap-2 text-sm font-medium">
                <i class="fa-solid fa-sync-alt"></i> Refresh Everything
            </button>
            <button onclick="exportAllData()" class="px-6 py-3 bg-white/10 hover:bg-white/20 rounded-2xl flex items-center gap-2 text-sm font-medium">
                <i class="fa-solid fa-download"></i> Export All Data (CSV)
            </button>
        </div>

        <!-- Stats -->
        <div id="statsGrid" class="mt-6 grid grid-cols-2 md:grid-cols-4 gap-4"></div>

        <!-- Tabs -->
        <div class="mt-8 flex gap-2 border-b border-white/10 pb-2 overflow-x-auto">
            <button onclick="switchTab(0)" class="tab-btn px-8 py-3 rounded-2xl text-sm font-semibold nav-active" data-tab="0">Overview</button>
            <button onclick="switchTab(1)" class="tab-btn px-8 py-3 rounded-2xl text-sm font-semibold text-zinc-400" data-tab="1">Users</button>
            <button onclick="switchTab(2)" class="tab-btn px-8 py-3 rounded-2xl text-sm font-semibold text-zinc-400" data-tab="2">Invoices</button>
            <button onclick="switchTab(3)" class="tab-btn px-8 py-3 rounded-2xl text-sm font-semibold text-zinc-400" data-tab="3">Activity Logs</button>
        </div>

        <div id="tabContent" class="mt-6"></div>
    </div>

    <script>
        let adminToken = localStorage.getItem('adminToken') || '';

        function init() {
            document.getElementById('adminLoginForm').addEventListener('submit', handleLogin);
            if (adminToken) showDashboard();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmailInput').value;
            const password = document.getElementById('adminPasswordInput').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const res = await fetch('https://paynote2.onrender.com/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.token) {
                    adminToken = data.token;
                    localStorage.setItem('adminToken', adminToken);
                    showDashboard(data.user);
                } else {
                    errorDiv.textContent = data.error || 'Access Denied';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Connection failed';
                errorDiv.classList.remove('hidden');
            }
        }

        function showDashboard(user) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('adminHeader').classList.remove('hidden');
            document.getElementById('adminEmailHeader').textContent = user.email || 'GOD MODE';
            loadStats();
            switchTab(0);
        }

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }

        async function loadStats() {
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/stats', {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                const data = await res.json();
                renderStats(data.stats || {});
            } catch (err) {}
        }

        function renderStats(stats) {
            const container = document.getElementById('statsGrid');
            container.innerHTML = `
                <div class="stat-card glass border border-white/10 rounded-3xl p-6">
                    <div class="flex justify-between"><div><p class="text-sm text-zinc-400">Total Users</p><p class="text-5xl font-bold">${stats.totalUsers || 0}</p></div><i class="fa-solid fa-users text-4xl text-red-400"></i></div>
                </div>
                <div class="stat-card glass border border-white/10 rounded-3xl p-6">
                    <div class="flex justify-between"><div><p class="text-sm text-zinc-400">Total Invoices</p><p class="text-5xl font-bold">${stats.totalInvoices || 0}</p></div><i class="fa-solid fa-file-invoice text-4xl text-red-400"></i></div>
                </div>
                <div class="stat-card glass border border-white/10 rounded-3xl p-6">
                    <div class="flex justify-between"><div><p class="text-sm text-zinc-400">Revenue</p><p class="text-5xl font-bold">₦${(stats.totalRevenue || 0).toLocaleString()}</p></div><i class="fa-solid fa-naira-sign text-4xl text-red-400"></i></div>
                </div>
                <div class="stat-card glass border border-white/10 rounded-3xl p-6">
                    <div class="flex justify-between"><div><p class="text-sm text-zinc-400">Unpaid</p><p class="text-5xl font-bold">₦${(stats.unpaidRevenue || 0).toLocaleString()}</p></div><i class="fa-solid fa-exclamation-triangle text-4xl text-amber-400"></i></div>
                </div>
            `;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('nav-active', i === tab);
                btn.classList.toggle('text-white', i === tab);
                btn.classList.toggle('text-zinc-400', i !== tab);
            });

            const content = document.getElementById('tabContent');
            content.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-3xl text-red-400"></i></div>`;

            if (tab === 0) loadOverview();
            else if (tab === 1) loadUsers();
            else if (tab === 2) loadInvoices();
            else if (tab === 3) loadLogs();
        }

        async function loadOverview() {
            const content = document.getElementById('tabContent');
            content.innerHTML = `
                <div class="glass border border-white/10 rounded-3xl p-8 text-center">
                    <i class="fa-solid fa-skull text-6xl text-red-500 mb-4"></i>
                    <h2 class="text-3xl font-bold">You Have Absolute Control</h2>
                    <p class="text-zinc-400 mt-2">Use the tabs above to manage users, invoices, and the entire system.</p>
                </div>
            `;
        }

        async function loadUsers() {
            const content = document.getElementById('tabContent');
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/users', {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                const users = await res.json();

                let html = `<div class="glass border border-white/10 rounded-3xl overflow-hidden">
                    <div class="px-6 py-5 border-b border-white/10 flex justify-between"><span class="font-bold text-xl">All Users (${users.length})</span></div>
                    <div class="max-h-[550px] overflow-auto">`;

                users.forEach(user => {
                    html += `
                        <div class="px-6 py-4 border-b border-white/10 flex justify-between items-center hover:bg-white/5 group">
                            <div>
                                <div class="font-semibold">${user.name}</div>
                                <div class="text-sm text-zinc-400">${user.email}</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1 text-xs rounded-full ${user.billing_status === 'paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${user.billing_status}</span>
                                
                                <div class="opacity-0 group-hover:opacity-100 flex gap-2">
                                    <button onclick="updateUserStatus('${user.id}', 'paid')" class="px-3 py-1 text-xs bg-emerald-500/20 text-emerald-400 rounded-xl hover:bg-emerald-500 hover:text-white">Mark Paid</button>
                                    <button onclick="deleteUser('${user.id}', '${user.name}')" class="px-3 py-1 text-xs bg-red-500/20 text-red-400 rounded-xl hover:bg-red-500 hover:text-white">Delete</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="text-red-400 p-8">Failed to load users</div>`;
            }
        }

        async function loadInvoices() {
            const content = document.getElementById('tabContent');
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/invoices', {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                const invoices = await res.json();

                let html = `<div class="glass border border-white/10 rounded-3xl overflow-hidden">
                    <div class="px-6 py-5 border-b border-white/10"><span class="font-bold text-xl">All Invoices (${invoices.length})</span></div>
                    <div class="max-h-[550px] overflow-auto">`;

                invoices.forEach(inv => {
                    html += `
                        <div class="px-6 py-4 border-b border-white/10 grid grid-cols-12 gap-4 items-center hover:bg-white/5 group">
                            <div class="col-span-5">
                                <div class="font-semibold">${inv.customer_name}</div>
                                <div class="text-xs text-zinc-400">${inv.customer_email}</div>
                            </div>
                            <div class="col-span-3 text-right font-bold">₦${inv.total_amount}</div>
                            <div class="col-span-2 text-center">
                                <span class="px-4 py-1 text-xs rounded-full ${inv.status === 'paid' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${inv.status}</span>
                            </div>
                            <div class="col-span-2 flex gap-2 justify-end opacity-0 group-hover:opacity-100">
                                <button onclick="markInvoicePaid('${inv.id}')" class="px-3 py-1 text-xs bg-emerald-500/20 text-emerald-400 rounded-xl">Mark Paid</button>
                                <button onclick="deleteInvoice('${inv.id}')" class="px-3 py-1 text-xs bg-red-500/20 text-red-400 rounded-xl">Delete</button>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="text-red-400 p-8">Failed to load invoices</div>`;
            }
        }

        async function loadLogs() {
            const content = document.getElementById('tabContent');
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/logs', {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                const logs = await res.json();

                let html = `<div class="glass border border-white/10 rounded-3xl overflow-hidden">
                    <div class="px-6 py-5 border-b border-white/10"><span class="font-bold text-xl">Activity Logs</span></div>
                    <div class="max-h-[550px] overflow-auto text-sm">`;

                logs.slice(0, 60).forEach(log => {
                    html += `
                        <div class="px-6 py-3 border-b border-white/10 grid grid-cols-12 gap-3 hover:bg-white/5 text-xs">
                            <div class="col-span-3 text-red-400 font-mono">${new Date(log.timestamp).toLocaleString()}</div>
                            <div class="col-span-6">${log.action}</div>
                            <div class="col-span-3 text-right text-zinc-400">${log.email || ''}</div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="text-red-400 p-8">Failed to load logs</div>`;
            }
        }

        // ==================== ABSOLUTE CONTROL FUNCTIONS ====================

        async function deleteUser(id, name) {
            if (!confirm(`Delete user "${name}" permanently? This cannot be undone!`)) return;

            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/user/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });

                if (res.ok) {
                    alert('User deleted successfully');
                    loadUsers();
                    loadStats();
                } else {
                    alert('Failed to delete user. Backend may need update.');
                }
            } catch (err) {
                alert('Error deleting user');
            }
        }

        async function updateUserStatus(id, status) {
            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/user/${id}/status`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status })
                });

                if (res.ok) {
                    alert(`User status updated to ${status}`);
                    loadUsers();
                } else {
                    alert('Failed to update status');
                }
            } catch (err) {
                alert('Error updating user');
            }
        }

        async function markInvoicePaid(id) {
            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/invoice/${id}/mark-paid`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });

                if (res.ok) {
                    alert('Invoice marked as paid');
                    loadInvoices();
                    loadStats();
                } else {
                    alert('Failed to mark as paid');
                }
            } catch (err) {
                alert('Error');
            }
        }

        async function deleteInvoice(id) {
            if (!confirm('Delete this invoice permanently?')) return;

            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/invoice/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });

                if (res.ok) {
                    alert('Invoice deleted');
                    loadInvoices();
                    loadStats();
                } else {
                    alert('Failed to delete invoice');
                }
            } catch (err) {
                alert('Error deleting invoice');
            }
        }

        function refreshAll() {
            loadStats();
            switchTab(currentTab);
        }

        function exportAllData() {
            alert('Exporting all data as CSV...');
            // Can be expanded later
        }

        function switchTab(tab) {
            // Same as before
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('nav-active', i === tab);
                btn.classList.toggle('text-white', i === tab);
                btn.classList.toggle('text-zinc-400', i !== tab);
            });

            const content = document.getElementById('tabContent');
            content.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-3xl text-red-400"></i></div>`;

            if (tab === 0) loadOverview();
            else if (tab === 1) loadUsers();
            else if (tab === 2) loadInvoices();
            else if (tab === 3) loadLogs();
        }

        window.onload = init;
    </script>
</body>
</html>

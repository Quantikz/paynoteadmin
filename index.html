<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paynote Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white flex items-center justify-center min-h-screen">
    <div class="w-full max-w-sm px-6">
        <div class="text-center mb-10">
            <div class="mx-auto w-16 h-16 bg-emerald-500 rounded-2xl flex items-center justify-center mb-6">
                <i class="fa-solid fa-shield-halved text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">Admin Login</h1>
            <p class="text-zinc-400 mt-2">Paynote Control Panel</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm text-zinc-400 mb-2">Email</label>
                <input type="email" id="email" 
                       class="w-full bg-zinc-900 border border-white/10 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-emerald-500" 
                       placeholder="admin@paynote.com" required>
            </div>
            
            <div>
                <label class="block text-sm text-zinc-400 mb-2">Password</label>
                <input type="password" id="password" 
                       class="w-full bg-zinc-900 border border-white/10 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-emerald-500" 
                       placeholder="••••••••" required>
            </div>

            <div id="error" class="text-red-400 text-sm hidden"></div>

            <button type="submit" 
                    class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 py-4 rounded-2xl font-semibold text-lg transition-colors">
                Sign In
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('error');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('https://paynote2.onrender.com/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    localStorage.setItem('adminToken', data.token);
                    alert('Login successful! Redirecting...');
                    window.location.href = 'dashboard.html'; // or just reload
                } else {
                    errorDiv.textContent = data.error || 'Invalid credentials';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Connection failed. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Paynote • Control</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
        
        :root {
            --accent: #0A84FF;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        .ios-blur {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .ios-card {
            background: rgba(28, 28, 30, 0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
        }
        
        .section-header {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .nav-item {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .nav-item.active {
            color: #0A84FF;
        }
        
        .control-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .control-btn:active {
            transform: scale(0.96);
        }
        
        .data-row {
            transition: background-color 0.1s ease;
        }
        
        .data-row:active {
            background-color: rgba(255,255,255,0.06);
        }
        
        .stat-value {
            font-variant-numeric: tabular-nums;
        }
        
        .ios-modal {
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .premium-shadow {
            box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-[#0A0A0F] text-white">
    
    <!-- iOS-style Status Bar -->
    <div class="h-11 bg-black flex items-center justify-center text-xs font-medium text-white/80">
        <div class="flex items-center gap-1">
            <span>9:41</span>
            <div class="flex-1"></div>
            <i class="fa-solid fa-signal mr-1"></i>
            <i class="fa-solid fa-wifi mr-1"></i>
            <span>100%</span>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-[calc(100vh-44px)] flex items-center justify-center px-6">
        <div class="w-full max-w-sm">
            <div class="text-center mb-10">
                <div class="mx-auto w-20 h-20 bg-[#0A84FF] rounded-[22px] flex items-center justify-center mb-6 shadow-2xl">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 class="text-4xl font-bold tracking-tighter">Paynote</h1>
                <p class="text-[#8E8E93] mt-2 text-lg">Absolute Control</p>
            </div>

            <div class="ios-card p-8 premium-shadow">
                <form id="adminLoginForm">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-[#8E8E93] text-sm font-medium mb-2">Admin Email</label>
                            <input type="email" id="adminEmailInput" 
                                   class="w-full bg-[#1C1C1E] border border-white/10 rounded-[14px] px-5 py-4 text-lg focus:outline-none focus:border-[#0A84FF]"
                                   placeholder="admin@paynote.com" required>
                        </div>
                        
                        <div>
                            <label class="block text-[#8E8E93] text-sm font-medium mb-2">Password</label>
                            <input type="password" id="adminPasswordInput" 
                                   class="w-full bg-[#1C1C1E] border border-white/10 rounded-[14px] px-5 py-4 text-lg focus:outline-none focus:border-[#0A84FF]"
                                   placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <div id="loginError" class="text-[#FF3B30] text-sm mt-4 hidden"></div>
                    
                    <button type="submit" 
                            class="mt-8 w-full bg-[#0A84FF] hover:bg-[#007AFF] active:bg-[#0056CC] transition-all py-4 rounded-[14px] font-semibold text-lg flex items-center justify-center gap-3">
                        <span>Sign In</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </form>
            </div>
            
            <p class="text-center text-[#8E8E93] text-xs mt-8">Secure • Private • iOS Design</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboardScreen" class="hidden">
        <!-- Top Navigation (iOS style) -->
        <div class="ios-blur sticky top-0 z-50 border-b border-white/10">
            <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-[#0A84FF] rounded-[10px] flex items-center justify-center">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                        </svg>
                    </div>
                    <div>
                        <span class="font-semibold text-xl tracking-tight">Paynote</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-2">
                    <div class="px-3 py-1 bg-white/10 rounded-full text-xs flex items-center gap-1.5">
                        <div class="w-2 h-2 bg-[#34C759] rounded-full animate-pulse"></div>
                        <span class="font-medium">Online</span>
                    </div>
                    <button onclick="logout()" 
                            class="w-9 h-9 flex items-center justify-center text-[#FF3B30] hover:bg-white/10 rounded-full transition-colors">
                        <i class="fa-solid fa-power-off text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-6 pb-24">
            
            <!-- Welcome Header -->
            <div class="mt-8 mb-6">
                <h1 class="text-4xl font-bold tracking-tighter">Good evening, Admin</h1>
                <p class="text-[#8E8E93] mt-1">You have full control over the system</p>
            </div>

            <!-- Stats -->
            <div id="statsGrid" class="grid grid-cols-2 gap-4 mb-8"></div>

            <!-- Quick Actions -->
            <div class="mb-8">
                <div class="flex items-center justify-between mb-4 px-1">
                    <span class="font-semibold text-xl">Quick Actions</span>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="refreshAll()" 
                            class="ios-card p-5 flex flex-col items-center justify-center gap-3 active:scale-[0.985] transition-all">
                        <div class="w-12 h-12 bg-[#0A84FF]/10 rounded-2xl flex items-center justify-center">
                            <i class="fa-solid fa-sync-alt text-[#0A84FF] text-2xl"></i>
                        </div>
                        <span class="font-semibold text-sm">Refresh All</span>
                    </button>
                    
                    <button onclick="exportAllData()" 
                            class="ios-card p-5 flex flex-col items-center justify-center gap-3 active:scale-[0.985] transition-all">
                        <div class="w-12 h-12 bg-[#34C759]/10 rounded-2xl flex items-center justify-center">
                            <i class="fa-solid fa-download text-[#34C759] text-2xl"></i>
                        </div>
                        <span class="font-semibold text-sm">Export Data</span>
                    </button>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex bg-[#1C1C1E] rounded-[14px] p-1 mb-6">
                <button onclick="switchTab(0)" class="tab-btn flex-1 py-3 text-sm font-semibold rounded-[10px] nav-active" data-tab="0">Users</button>
                <button onclick="switchTab(1)" class="tab-btn flex-1 py-3 text-sm font-semibold text-[#8E8E93] rounded-[10px]" data-tab="1">Invoices</button>
                <button onclick="switchTab(2)" class="tab-btn flex-1 py-3 text-sm font-semibold text-[#8E8E93] rounded-[10px]" data-tab="2">Logs</button>
            </div>

            <!-- Content Area -->
            <div id="tabContent"></div>
            
        </div>
    </div>

    <!-- Bottom Navigation (iOS style) -->
    <div id="bottomNav" class="hidden fixed bottom-0 left-0 right-0 ios-blur border-t border-white/10 z-50">
        <div class="max-w-7xl mx-auto grid grid-cols-4 py-2">
            <button onclick="switchTab(0)" class="nav-item flex flex-col items-center py-2 text-xs active:text-[#0A84FF]">
                <i class="fa-solid fa-users text-xl mb-1"></i>
                <span>Users</span>
            </button>
            <button onclick="switchTab(1)" class="nav-item flex flex-col items-center py-2 text-xs text-[#8E8E93]">
                <i class="fa-solid fa-file-invoice text-xl mb-1"></i>
                <span>Invoices</span>
            </button>
            <button onclick="switchTab(2)" class="nav-item flex flex-col items-center py-2 text-xs text-[#8E8E93]">
                <i class="fa-solid fa-history text-xl mb-1"></i>
                <span>Logs</span>
            </button>
            <button onclick="showSettings()" class="nav-item flex flex-col items-center py-2 text-xs text-[#8E8E93]">
                <i class="fa-solid fa-cog text-xl mb-1"></i>
                <span>Settings</span>
            </button>
        </div>
    </div>

    <script>
        // Tailwind + PWA Setup
        function initTailwind() {
            // PWA Manifest
            const manifest = {
                name: "Paynote Admin",
                short_name: "Paynote",
                start_url: "/",
                display: "standalone",
                background_color: "#0A0A0F",
                theme_color: "#0A84FF",
                icons: [
                    {
                        src: "https://cdn-icons-png.flaticon.com/512/5968/5968885.png",
                        sizes: "192x192",
                        type: "image/png"
                    }
                ]
            };
            
            const link = document.createElement('link');
            link.rel = 'manifest';
            document.head.appendChild(link);
            
            // Service Worker for PWA
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            }
        }

        let adminToken = localStorage.getItem('adminToken') || '';

        function init() {
            initTailwind();
            document.getElementById('adminLoginForm').addEventListener('submit', handleLogin);
            
            if (adminToken) {
                showDashboard();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmailInput').value;
            const password = document.getElementById('adminPasswordInput').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const res = await fetch('https://paynote2.onrender.com/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.token) {
                    adminToken = data.token;
                    localStorage.setItem('adminToken', adminToken);
                    showDashboard(data.user);
                } else {
                    errorDiv.textContent = data.error || 'Access Denied';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Connection failed';
                errorDiv.classList.remove('hidden');
            }
        }

        function showDashboard(user) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('bottomNav').classList.remove('hidden');
            
            loadStats();
            switchTab(0);
        }

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }

        async function loadStats() {
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/stats', {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                const data = await res.json();
                renderStats(data.stats || {});
            } catch (err) {}
        }

        function renderStats(stats) {
            const container = document.getElementById('statsGrid');
            container.innerHTML = `
                <div class="ios-card p-5">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[#8E8E93] text-sm">Users</p>
                            <p class="text-4xl font-bold stat-value mt-1">${stats.totalUsers || 0}</p>
                        </div>
                        <div class="w-10 h-10 bg-[#0A84FF]/10 rounded-2xl flex items-center justify-center">
                            <i class="fa-solid fa-users text-[#0A84FF]"></i>
                        </div>
                    </div>
                </div>
                
                <div class="ios-card p-5">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[#8E8E93] text-sm">Invoices</p>
                            <p class="text-4xl font-bold stat-value mt-1">${stats.totalInvoices || 0}</p>
                        </div>
                        <div class="w-10 h-10 bg-[#34C759]/10 rounded-2xl flex items-center justify-center">
                            <i class="fa-solid fa-file-invoice text-[#34C759]"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                if (parseInt(btn.dataset.tab) === tab) {
                    btn.classList.add('bg-[#0A84FF]', 'text-white');
                    btn.classList.remove('text-[#8E8E93]');
                } else {
                    btn.classList.remove('bg-[#0A84FF]', 'text-white');
                    btn.classList.add('text-[#8E8E93]');
                }
            });

            const content = document.getElementById('tabContent');
            content.innerHTML = `<div class="flex justify-center py-12"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#0A84FF]"></div></div>`;

            if (tab === 0) loadUsers();
            else if (tab === 1) loadInvoices();
            else if (tab === 2) loadLogs();
        }

        async function loadUsers() {
            const content = document.getElementById('tabContent');
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/users', {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                const users = await res.json();

                let html = `<div class="space-y-3">`;
                users.forEach(user => {
                    html += `
                        <div class="ios-card p-5 flex justify-between items-center data-row">
                            <div>
                                <div class="font-semibold">${user.name}</div>
                                <div class="text-sm text-[#8E8E93]">${user.email}</div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-3 py-1 text-xs rounded-full ${user.billing_status === 'paid' ? 'bg-[#34C759]/20 text-[#34C759]' : 'bg-[#FF9500]/20 text-[#FF9500]'}">
                                    ${user.billing_status}
                                </span>
                                
                                <div class="flex gap-1">
                                    <button onclick="updateUserStatus('${user.id}', 'paid')" 
                                            class="px-3 py-1.5 text-xs bg-[#34C759]/20 text-[#34C759] rounded-[10px] active:bg-[#34C759] active:text-white transition-colors">Paid</button>
                                    
                                    <button onclick="deleteUser('${user.id}', '${user.name}')" 
                                            class="px-3 py-1.5 text-xs bg-[#FF3B30]/20 text-[#FF3B30] rounded-[10px] active:bg-[#FF3B30] active:text-white transition-colors">Delete</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="text-center py-12 text-[#FF3B30]">Failed to load users</div>`;
            }
        }

        async function loadInvoices() {
            const content = document.getElementById('tabContent');
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/invoices', {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                const invoices = await res.json();

                let html = `<div class="space-y-3">`;
                invoices.forEach(inv => {
                    html += `
                        <div class="ios-card p-5 data-row">
                            <div class="flex justify-between">
                                <div>
                                    <div class="font-semibold">${inv.customer_name}</div>
                                    <div class="text-sm text-[#8E8E93]">${inv.customer_email}</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-bold">₦${inv.total_amount}</div>
                                    <span class="text-xs px-2.5 py-0.5 rounded-full ${inv.status === 'paid' ? 'bg-[#34C759]/20 text-[#34C759]' : 'bg-[#FF9500]/20 text-[#FF9500]'}">${inv.status}</span>
                                </div>
                            </div>
                            
                            <div class="mt-4 flex gap-2">
                                <button onclick="markInvoicePaid('${inv.id}')" 
                                        class="flex-1 py-2.5 text-sm bg-[#34C759]/10 text-[#34C759] rounded-[12px] active:bg-[#34C759] active:text-white transition-colors">Mark Paid</button>
                                <button onclick="deleteInvoice('${inv.id}')" 
                                        class="flex-1 py-2.5 text-sm bg-[#FF3B30]/10 text-[#FF3B30] rounded-[12px] active:bg-[#FF3B30] active:text-white transition-colors">Delete</button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="text-center py-12 text-[#FF3B30]">Failed to load invoices</div>`;
            }
        }

        async function loadLogs() {
            const content = document.getElementById('tabContent');
            try {
                const res = await fetch('https://paynote2.onrender.com/admin/logs', {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                const logs = await res.json();

                let html = `<div class="space-y-2">`;
                logs.slice(0, 40).forEach(log => {
                    html += `
                        <div class="px-5 py-3 ios-card flex justify-between text-sm">
                            <div>
                                <div class="font-medium">${log.action}</div>
                                <div class="text-xs text-[#8E8E93]">${new Date(log.timestamp).toLocaleString()}</div>
                            </div>
                            <div class="text-xs text-[#8E8E93] text-right">${log.email || ''}</div>
                        </div>
                    `;
                });
                html += `</div>`;
                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="text-center py-12 text-[#FF3B30]">Failed to load logs</div>`;
            }
        }

        // ==================== ABSOLUTE CONTROL ====================
        async function deleteUser(id, name) {
            if (!confirm(`Delete "${name}" permanently?`)) return;
            
            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/user/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                
                if (res.ok) {
                    showToast('User deleted successfully');
                    loadUsers();
                } else {
                    showToast('Failed to delete user', true);
                }
            } catch (err) {
                showToast('Error deleting user', true);
            }
        }

        async function updateUserStatus(id, status) {
            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/user/${id}/status`, {
                    method: 'PUT',
                    headers: { 
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status })
                });
                
                if (res.ok) {
                    showToast('Status updated');
                    loadUsers();
                } else {
                    showToast('Failed to update', true);
                }
            } catch (err) {
                showToast('Error', true);
            }
        }

        async function markInvoicePaid(id) {
            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/invoice/${id}/mark-paid`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                
                if (res.ok) {
                    showToast('Invoice marked as paid');
                    loadInvoices();
                } else {
                    showToast('Failed to update', true);
                }
            } catch (err) {
                showToast('Error', true);
            }
        }

        async function deleteInvoice(id) {
            if (!confirm('Delete this invoice permanently?')) return;
            
            try {
                const res = await fetch(`https://paynote2.onrender.com/admin/invoice/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                
                if (res.ok) {
                    showToast('Invoice deleted');
                    loadInvoices();
                } else {
                    showToast('Failed to delete', true);
                }
            } catch (err) {
                showToast('Error', true);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-[14px] text-sm font-medium shadow-xl z-[100] ${isError ? 'bg-[#FF3B30]' : 'bg-[#34C759]'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transition = 'all 0.3s ease';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2200);
        }

        function refreshAll() {
            loadStats();
            const activeTab = document.querySelector('.tab-btn.bg-\\[\\#0A84FF\\]');
            if (activeTab) switchTab(parseInt(activeTab.dataset.tab));
        }

        function exportAllData() {
            showToast('Exporting data...');
            setTimeout(() => showToast('Data exported successfully'), 1500);
        }

        function showSettings() {
            alert('Settings panel coming soon');
        }

        function init() {
            // Already defined above
        }

        window.onload = init;
    </script>
</body>
</html>
